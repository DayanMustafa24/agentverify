[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentverify"
version = "0.1.0"
description = "Calibrated, evidence-grounded multi-agent detection of multimodal fake news (Phase 1 baseline)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scikit-learn",
  "pillow",
  "pydantic>=2",
  "requests",
  "matplotlib",
  "tqdm",
  "openai>=1.30",
  "ddgs",
]

[project.optional-dependencies]
clip = ["torch", "transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
